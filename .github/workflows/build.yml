name: Build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Compile on Java 17 and 21
    runs-on: ubuntu-latest
    strategy:
      matrix:
        java: [17, 21]
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven

      - name: Build the SDK
        run: mvn -B package

      - name: Compile the example
        run: |
          mvn -B -q dependency:build-classpath -Dmdep.outputFile=cp.txt
          mkdir -p target/examples
          javac -Xlint:all -Werror -d target/examples -cp "target/coingecko-java-1.0.0.jar:$(cat cp.txt)" examples/QuickStart.java
